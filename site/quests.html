<!doctype html>
<html lang="fr">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8928406232312253"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bipbip Recharge — Quêtes &amp; Points</title>
<meta name="description" content="Gagnez des points : daily check-in, quêtes, lecture d'articles. Historique de vos points.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Mountains+of+Christmas:wght@700&family=Creepster&family=Dancing+Script:wght@600;700&family=Amiri:wght@700&family=Pacifico&family=Permanent+Marker&family=Caveat:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/shared/theme/theme-tokens.css">
<link rel="stylesheet" href="/shared/theme/theme-particles.css">
<link rel="stylesheet" href="/shared/theme/theme-ui.css">
<link rel="stylesheet" href="/bipbip-dynamic-scene.css">
<link rel="stylesheet" href="/site/css/site.css">

<script defer src="/shared/api/api-client.js"></script>
<script defer src="/shared/i18n/i18n.js"></script>
<script defer src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="dns-prefetch" href="https://accounts.google.com">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/shared/theme/theme-engine.js" data-no-auto></script>

<script defer src="/site/js/core.js"></script>
<script defer src="/site/js/shell.js"></script>
<script defer src="/site/js/quests.js"></script>
</head>

<body class="bb-shell" data-page="quests">

  <div class="site-wrap">
    <div class="page-head">
      <h1 data-bbt="ph.quests.t">Quêtes &amp; Points</h1>
      <p data-bbt="ph.quests.s">Connecte-toi chaque jour, accomplis des missions et lis des articles pour gagner des points.</p>
    </div>

    <!-- Daily check-in -->
    <section class="bb-card daily-checkin">
      <div class="daily-checkin__head">
        <div class="daily-checkin__title">
          <iconify-icon icon="solar:calendar-mark-linear" width="26"></iconify-icon>
          <div>
            <div class="daily-checkin__title-main">Daily check-in</div>
            <div class="daily-checkin__title-sub">Connecte-toi chaque jour pour gagner des points.</div>
          </div>
        </div>
        <div class="daily-checkin__streak"><span id="dailyStreak">0/7</span><small>jours</small></div>
      </div>
      <div class="daily-checkin__grid" id="dailyGrid"></div>
      <button class="daily-checkin__claim" type="button" id="dailyClaimBtn">RÉCLAMER</button>
      <p class="daily-checkin__status" id="dailyStatus" style="display:none"></p>
    </section>

    <!-- Quêtes -->
    <h2 class="section-title"><iconify-icon icon="solar:document-text-linear" width="22"></iconify-icon> <span data-bbt="quests.daily">Quêtes générales</span></h2>
    <div class="quests-list" id="questsList"></div>

    <!-- Historique des points -->
    <h2 class="section-title"><iconify-icon icon="solar:history-linear" width="22"></iconify-icon> <span data-bbt="quests.history">Historique des points</span></h2>
    <section class="bb-card" style="padding:8px 22px"><div id="pointsHistory"></div></section>
  </div>

</body>
</html>
